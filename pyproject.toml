[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rudytrade-ai"
version = "0.1.0"
description = "Paper-only trading research and simulation platform"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
broker = ["smartapi-python"]
research = ["numpy", "pandas", "scikit-learn", "torch", "stable-baselines3", "gymnasium", "optuna"]
dashboard = ["streamlit", "plotly"]
cloud = ["psycopg[binary]"]

[project.scripts]
rudytrade = "rudytrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
